<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas por Equipe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #eaeaea;
        }
        .center{
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Partidas por Equipes do Mundial de Clubes FIFA 2025</h1>
    <div class="center">
        <table id="partidas">
            <tr>
                <th>Equipe</th>
                <th>Quantidade de Jogos</th>
            </tr>
        </table>
    </div>
    

    <script>
        async function carregarPagina() {
            const api = "http://projetos.farroupilha.ifrs.edu.br:35005/~projetoMyCup/api/partidas";

            try {
                const resposta = await fetch(api);
                if (!resposta.ok) throw new Error("Erro ao buscar os dados.");

                const dados = await resposta.json();
                exibirPartidas(dados);
            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById("partidas").innerHTML += 
                    "<tr><td colspan='2'>Erro ao carregar dados.</td></tr>";
            }
        }

        function exibirPartidas(partidas) {
            const tabela = document.getElementById("partidas");

            partidas.forEach(item => {
                const linha = document.createElement("tr");

                const tdEquipe = document.createElement("td");
                tdEquipe.textContent = item.equipe;

                const tdJogos = document.createElement("td");
                tdJogos.textContent = item.quantidade_jogos;

                linha.appendChild(tdEquipe);
                linha.appendChild(tdJogos);

                tabela.appendChild(linha);
            });
        }

        document.addEventListener("DOMContentLoaded", carregarPagina);
    </script>
</body>
</html>
